<!doctype html>
<meta charset="utf-8" />
<title>Schedule — Residents × Weeks</title>
<style>
  body{font-family:system-ui,Arial;padding:16px}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid #e5e7eb;padding:6px 8px;vertical-align:middle;text-align:center}
  th{background:#f8fafc;position:sticky;top:0;z-index:1}
  thead th:first-child, tbody th:first-child{position:sticky;left:0;background:#f8fafc;text-align:left;z-index:2}
  .muted{color:#9ca3af}
  .chip{display:inline-block;border:1px solid #d1d5db;border-radius:999px;padding:2px 8px;font-size:12px;line-height:1}
  .svc-CC{background:#ffee00;border-color:#eeff00;}
  .svc-ELECTIVE{background:#bebdbd;border-color:#ffffff}
  .svc-WARD{background:#200096;border-color:#ffffff;color:#ffffff}
  .svc-STROKE{background:#ff0000;border-color:#d69999}
  .svc-UH{background:#ae00ff;border-color:#d69999}
  .svc-B-U{background:#00ff22;border-color:#d69999}
  .svc-OFF{background:#000000;border-color:#000000;color:#ffffff}
</style>

<h1>Schedule</h1>
<div id="out">Loading…</div>

<script>
(async function () {
  const out = document.getElementById('out');
  const qp = new URLSearchParams(location.search);
  const count = Number(qp.get('count') || 53);

  try {
    const weeksResp = await fetch(`/api/weeks?count=${count}`);
    if (!weeksResp.ok) {
      out.innerHTML = `<pre style="color:crimson">/api/weeks failed: ${weeksResp.status} ${weeksResp.statusText}</pre>`;
      return;
    }
    const data = await weeksResp.json();
    if (!data.ok) {
      out.innerHTML = `<pre style="color:crimson">${JSON.stringify(data,null,2)}</pre>`;
      return;
    }

    const weeks = Array.isArray(data.weeks) ? data.weeks : [];

    const resMap = new Map(); 
    const keyOf = (a) => (a.residentId && String(a.residentId)) || (a.residentName || '(unknown)');

    for (const w of weeks) {
      for (const a of (w.assignments || [])) {
        const k = keyOf(a);
        if (!resMap.has(k)) resMap.set(k, { name: a.residentName || k, year: a.residentYear || '' });
      }
      for (const o of (w.weekOff || [])) {
        const k = keyOf(o);
        if (!resMap.has(k)) resMap.set(k, { name: o.residentName || k, year: o.residentYear || '' });
      }
    }

    const residents = [...resMap.entries()]
      .map(([k, v]) => {
        const y = Number(v.year);
        return {
          key: k,
          name: v.name || k,
          year: Number.isFinite(y) ? y : 999,
        };
      })
      .sort((a, b) => (a.year - b.year) || a.name.localeCompare(b.name));


    const grid = new Map();
    for (const w of weeks) {
      const m = new Map();
      for (const a of (w.assignments || [])) {
        const k = keyOf(a);
        const svc = (a.service || '').toUpperCase();
        if (!m.has(k)) m.set(k, svc);
        else m.set(k, m.get(k) + ', ' + svc);
      }
      for (const o of (w.weekOff || [])) {
        const k = keyOf(o);
        m.set(k, 'OFF');
      }
      grid.set(w.week, m);
    }

    let html = '<table><thead><tr><th>Resident</th>';
    weeks.forEach(w => { html += `<th>W${w.week}</th>`; });
    html += '</tr></thead><tbody>';

    const chip = (svc) => {
      const cls = 'chip svc-' + (svc || '').toUpperCase().replace(/\s+/g,'');
      return `<span class="${cls}">${svc}</span>`;
    };

    for (const r of residents) {
      const left = r.year ? `${r.name} <span class="muted">(PGY-${r.year})</span>` : r.name;
      html += `<tr><th>${left}</th>`;
      for (const w of weeks) {
        const svc = (grid.get(w.week) && grid.get(w.week).get(r.key)) || '';
        if (!svc) {
          html += `<td class="muted">—</td>`;
        } else if (svc === 'OFF') {
          html += `<td>${chip('OFF')}</td>`;
        } else {
          html += `<td>${chip(svc)}</td>`;
        }
      }
      html += '</tr>';
    }
    html += `<tr><th><b>Total</b></th>`;
    for (const w of weeks) {
      const m = grid.get(w.week) || new Map();
      let total = 0;
      m.forEach((svc) => { if (svc && svc !== 'OFF') total += 1; });
      html += `<td><b>${total}</b></td>`;
    }
    html += `</tr>`;

    html += '</tbody></table>';
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = '<pre style="color:crimson">Error: ' + (e && e.message || e) + '</pre>';
    console.error(e);
  }
})();
</script>
